name: ci
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make check
      - run: CGO_ENABLED=0 go build ./...
      - run: make deploy-sync-check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run typecheck && npm run lint && npm run build

  # Validates deploy/Dockerfile still builds on every PR; does not push
  # anywhere. The release job below does the real build-and-push.
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: |
            VERSION=pr-${{ github.sha }}
            COMMIT=${{ github.sha }}

  # Decides whether this run publishes a release and under which tag: a push
  # to main or a manual workflow_dispatch releases "v$(cat VERSION)" when
  # that tag does not already exist, so bumping the VERSION file on main is
  # the normal way to cut a release.
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          publish=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; nothing to release"
          else
            publish=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish tag=$tag"

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
      - run: make deploy-sync-check
      - name: Cross-compile and package linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          ldflags="-s -w -X main.version=$ver -X main.commit=$commit"
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="dist/stage-$arch"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/styr" ./cmd/styr
            cp LICENSE README.md deploy/install.sh deploy/styr.service deploy/config.example.yaml "$stage/"
            tar -czf "dist/styr_${ver}_linux_${arch}.tar.gz" -C "$stage" .
          done
          ( cd dist && sha256sum styr_"${ver}"_linux_amd64.tar.gz styr_"${ver}"_linux_arm64.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS
          echo "ver=$ver" >> "$GITHUB_ENV"
      # A tag pushed with GITHUB_TOKEN does not start another workflow run,
      # so nothing releases twice.
      - name: Create and push the release tag
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
      - uses: softprops/action-gh-release@v2
        with:
          # RELEASE_TOKEN (optional repository secret: a fine-grained PAT
          # with contents:write) takes over when the workflow token may not
          # create releases.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Styr: self-hosted mission control for Claude Code agents. Start, watch,
            steer and approve sessions from a browser or phone.

            Install or upgrade with one command:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/jonasthim/styr/main/deploy/install.sh | sudo bash
            ```

            Or Docker: `ghcr.io/jonasthim/styr:${{ env.ver }}` (also tagged `latest`).
            See `deploy/README.md`.
          files: |
            dist/styr_${{ env.ver }}_linux_amd64.tar.gz
            dist/styr_${{ env.ver }}_linux_arm64.tar.gz
            dist/SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/jonasthim/styr:${{ env.ver }}
            ghcr.io/jonasthim/styr:latest
          build-args: |
            VERSION=${{ env.ver }}
            COMMIT=${{ github.sha }}
