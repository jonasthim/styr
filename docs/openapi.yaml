openapi: 3.1.0
info:
  title: Styr API
  description: >
    Styr's REST and SSE API: OIDC login, Claude Code and Codex sessions,
    approvals, workspaces, profiles, templates, triggers, pipelines,
    schedules and server administration.


    **Compatibility promise (v1):** within the 1.x line the API only
    changes additively. Fields are never removed or retyped, and a new
    required request-body field is never added to an existing operation.
    New optional fields, new operations and new enum values may appear in
    any 1.x release. Deprecations are announced in CHANGELOG.md with at
    least one minor release's notice before removal, which — for this
    document — only happens at 2.0. See docs/API.md for the full
    compatibility policy and hack/openapi-compat, the CI check that
    enforces it against the previous release's copy of this document.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: /
security:
  - sessionCookie: []
  - bearerToken: []
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      security: []
      tags: [status]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /api/v1/version:
    get:
      summary: Server and API version
      description: >
        Unauthenticated, like /healthz: a client or a monitoring probe can
        call it before it has any credentials to learn what it is talking
        to. api_version is docs/openapi.yaml's own info.version (the stable
        API's version, per the compatibility promise); version is the styr
        binary's own release version, which may move independently.
      operationId: getVersion
      security: []
      tags: [status]
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: The styr binary's own release version, e.g. "0.5.0" ("dev" outside a release build).
                  api_version:
                    type: string
                    description: The stable API's version, e.g. "1.0.0".
                  commit:
                    type: string
                    description: The short git revision the running binary was built from ("unknown" if unavailable).
                required: [version, api_version, commit]

  /api/v1/auth/providers:
    get:
      summary: List configured OIDC login providers
      operationId: listAuthProviders
      security: []
      tags: [auth]
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /api/v1/auth/login/{slug}:
    get:
      summary: Begin an OIDC login
      operationId: beginAuthLogin
      security: []
      tags: [auth]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint

  /api/v1/auth/callback:
    get:
      summary: Complete an OIDC login
      operationId: completeAuthLogin
      security: []
      tags: [auth]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to "/" on success, "/login?error=..." on failure

  /api/v1/auth/logout:
    post:
      summary: Log out
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out

  /api/v1/auth/logout-all:
    post:
      summary: Log out every browser session for the current user
      operationId: logoutAll
      tags: [auth]
      responses:
        "204":
          description: Logged out everywhere
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      summary: Get the current user
      description: >
        Unlike GET/PATCH /users/{id} (admin-only, no claude_token), this is
        the signed-in user's own record and always carries their
        claude_token summary.
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update the current user's preferences
      operationId: patchMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefs:
                  type: object
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /api/v1/me/claude-token:
    put:
      summary: Set the current user's Claude token
      description: >
        The token is verified before anything is stored; on a failed verify
        nothing is written and the response is 422 token_invalid. The token
        itself is never returned by any response.
      operationId: putMeClaudeToken
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "204":
          description: Token verified and stored
        "422":
          description: The token failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Remove the current user's Claude token
      operationId: deleteMeClaudeToken
      tags: [me]
      responses:
        "204":
          description: Removed (idempotent)

  /api/v1/me/codex-key:
    put:
      summary: Set the current user's Codex API key
      description: >
        The OpenAI API key the user's Codex sessions run with, handed to the
        child process as OPENAI_API_KEY and nothing else. It is verified (one
        read-only `codex exec` turn) before anything is stored; on a failed
        verify nothing is written and the response is 422 key_invalid. The key
        itself is never returned by any response - only a label made of its
        last four characters. 501 when the server has no Codex harness wired
        in.
      operationId: putMeCodexKey
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
              required: [key]
      responses:
        "204":
          description: Key verified and stored
        "422":
          description: The key failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: The Codex harness is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Remove the current user's Codex API key
      operationId: deleteMeCodexKey
      tags: [me]
      responses:
        "204":
          description: Removed (idempotent)
        "501":
          description: The Codex harness is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me/api-tokens:
    get:
      summary: List the current user's personal API tokens
      description: >
        Never includes the raw secret, only for POST's response, once, at
        creation. Newest first.
      operationId: listMeAPITokens
      tags: [me]
      responses:
        "200":
          description: The current user's tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a personal API token
      description: >
        A personal API token authenticates as its owner via `Authorization:
        Bearer styr_pat_...`, in place of the styr_session cookie, and is
        exempt from the X-Requested-With CSRF header rule. The raw token is
        returned only in this response; only its sha256 hash is stored, so
        it cannot be retrieved again after this call.
      operationId: createMeAPIToken
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                expires_in_days:
                  type: integer
                  description: Omit or 0 for a token that never expires.
              required: [name]
      responses:
        "201":
          description: Created; the token is only ever returned here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreated"
        "422":
          description: name is required (or expires_in_days is out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me/api-tokens/{id}:
    delete:
      summary: Revoke a personal API token
      description: Only the current user's own tokens; any other id is 404.
      operationId: deleteMeAPIToken
      tags: [me]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users:
    get:
      summary: List users
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Every user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{id}:
    patch:
      summary: Change a user's role
      operationId: patchUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, member, viewer]
              required: [role]
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/settings:
    get:
      summary: Get server-wide settings
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Server-wide settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_open_sessions:
                    type: integer
                  idle_timeout:
                    type: string
                    description: A Go duration string, e.g. "15m0s".
                  service_token:
                    $ref: "#/components/schemas/ClaudeToken"
                  codex_key:
                    $ref: "#/components/schemas/CodexKey"
                required: [max_open_sessions, idle_timeout, service_token, codex_key]
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/service-token:
    put:
      summary: Set the service-wide Claude token
      description: Same verify-then-store rule as PUT /me/claude-token.
      operationId: putServiceToken
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "204":
          description: Token verified and stored
        "422":
          description: The token failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/codex-key:
    put:
      summary: Set the service-wide Codex API key
      description: >
        The OpenAI API key unattended Codex sessions (webhook, schedule and
        pipeline runs, which have no owner) run with. Same verify-then-store
        rule as PUT /me/codex-key.
      operationId: putServiceCodexKey
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
              required: [key]
      responses:
        "204":
          description: Key verified and stored
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The key failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: The Codex harness is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces:
    get:
      summary: List workspaces
      description: >
        Every workspace visible to the current user: workspaces they own,
        shared (admin-registered) workspaces, and — for an admin — every
        workspace.
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: Every visible workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      summary: Create a workspace
      description: >
        Styr manages a workspace's directory unless source is "path". For
        source "git" the workspace is created in state "cloning" and
        cloned in the background (poll GET /workspaces/{id} or watch
        "workspace.state" on the SSE stream for the transition to "ready"
        or "failed"). For source "empty" a fresh directory is created and
        `git init -b main` is run synchronously. For source "path" — an
        existing absolute server path, shared by everyone — the caller
        must be an admin, and path must exist, be a directory, and
        contain a .git entry (directory or file); otherwise 422
        invalid_path. default_profile_id defaults to "interactive" when
        omitted.
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                source:
                  type: string
                  enum: [git, path, empty]
                repo_url:
                  type: string
                  description: Required when source is "git".
                branch:
                  type: string
                  description: Optional, source "git" only.
                path:
                  type: string
                  description: Required when source is "path".
                default_profile_id:
                  type: string
                worktrees:
                  type: boolean
                base_branch:
                  type: string
                  description: >
                    The branch session worktrees are created from. Empty (the
                    default) means the checkout's current branch.
                auto_checkpoint:
                  type: boolean
                  description: >
                    Commit the session worktree after every turn. Omitted
                    means on.
              required: [name, source]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          description: source "path" was requested by a non-admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >
            invalid_url (source "git", a malformed repo_url), invalid_path
            (source "path", not an existing git directory), or name_taken
            (the name is already used by another workspace owned by this
            user, or by another shared workspace)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces/{id}:
    get:
      summary: Get a workspace
      operationId: getWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a workspace
      description: The owner or an admin may update default_profile_id and/or worktrees.
      operationId: patchWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_profile_id:
                  type: string
                worktrees:
                  type: boolean
                base_branch:
                  type: string
                auto_checkpoint:
                  type: boolean
      responses:
        "200":
          description: The updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a workspace
      description: >
        The owner or an admin may delete a workspace. For a managed
        workspace (source "git" or "empty") its directory is removed too;
        a shared "path" workspace's directory is left alone.
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A session on this workspace is still open, running or waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces/{id}/retry:
    post:
      summary: Retry a failed clone
      description: >
        Re-runs the clone for a source "git" workspace currently in state
        "failed", transitioning it back to "cloning".
      operationId: retryWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace, now in state "cloning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The workspace is not a failed git-source workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces/{id}/access:
    get:
      summary: Get a shared workspace's access mode and allowlist (admin-only)
      description: >
        Only meaningful for a shared (owner-less) workspace: 422 for an
        owned one. "users" is empty when access is "everyone".
      operationId: getWorkspaceAccess
      tags: [workspaces, admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace's access mode and, for "listed", its allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    put:
      summary: Set a shared workspace's access mode and allowlist (admin-only)
      description: >
        Only meaningful for a shared (owner-less) workspace: 422 for an
        owned one. Switching back to "everyone" clears any previously set
        allowlist.
      operationId: putWorkspaceAccess
      tags: [workspaces, admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access:
                  type: string
                  enum: [everyone, listed]
                user_ids:
                  type: array
                  items:
                    type: string
                  description: Ignored when access is "everyone".
              required: [access]
      responses:
        "204":
          description: Access updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/profiles:
    get:
      summary: List profiles
      operationId: listProfiles
      tags: [profiles]
      responses:
        "200":
          description: Every profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      summary: Create a profile
      operationId: createProfile
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum: [default, acceptEdits, plan, dontAsk, auto]
                allowed_tools:
                  type: array
                  items:
                    type: string
                disallowed_tools:
                  type: array
                  items:
                    type: string
                max_turns:
                  type: integer
                unattended:
                  type: boolean
                approval_timeout:
                  type: integer
                  description: Seconds.
                model:
                  type: string
                effort:
                  type: string
                  enum: ["", low, medium, high, xhigh, max]
                harness:
                  type: string
                  enum: [claude, codex]
                  description: >
                    The agentic CLI sessions started under this profile run
                    on unless the request names another. Defaults to claude.
              required: [name, mode]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "422":
          description: mode is not an allowed permission mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/profiles/{id}:
    patch:
      summary: Update a profile
      description: >
        Builtin profiles only allow max_turns, approval_timeout, model,
        effort and harness to change. mode may never be the CLI's skip-all-permissions
        mode (422 on any profile; see internal/harness's validModes), and
        effort must be one of the valid levels.
      operationId: patchProfile
      tags: [profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                allowed_tools:
                  type: array
                  items:
                    type: string
                disallowed_tools:
                  type: array
                  items:
                    type: string
                max_turns:
                  type: integer
                unattended:
                  type: boolean
                approval_timeout:
                  type: integer
                model:
                  type: string
                effort:
                  type: string
                  enum: ["", low, medium, high, xhigh, max]
                harness:
                  type: string
                  enum: [claude, codex]
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "422":
          description: Disallowed mode, or a non-editable field on a builtin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions:
    get:
      summary: List sessions visible to the current user
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Visible sessions, in attention order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      summary: Create a session
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
                profile_id:
                  type: string
                title:
                  type: string
                prompt:
                  type: string
                model:
                  type: string
                  description: >
                    Overrides the profile's model default. Empty falls back
                    to the profile's, then to the CLI's own default.
                effort:
                  type: string
                  enum: ["", low, medium, high, xhigh, max]
                  description: Overrides the profile's effort default.
                harness:
                  type: string
                  enum: [claude, codex]
                  description: >
                    The agentic CLI to run this session on. Empty falls back
                    to the profile's own default, then to claude. A codex
                    session requires the owner's Codex API key (PUT
                    /me/codex-key), or the service-wide one for an unattended
                    run.
                worktree_path:
                  type: string
                  description: >
                    Starts the session on an existing worktree (typically
                    another session's, under the workspace's
                    .styr/worktrees/ directory) instead of creating a fresh
                    one, so a pipeline "worktree: shared" step can continue
                    where the previous step left off. Empty (the default)
                    creates a fresh worktree as before. The workspace must
                    have worktrees enabled; otherwise the request is 422.
              required: [workspace_id, profile_id, prompt]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: workspace_id is not visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The workspace is not yet ready (e.g. still cloning)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >
            No credential available for the current user for the chosen
            harness (a Claude token, or a Codex API key for a codex session;
            add one in profile settings), an unknown or unavailable harness,
            or worktree_path does not point to an
            existing worktree registered under the workspace's
            .styr/worktrees/ directory (or the workspace has worktrees
            disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}:
    get:
      summary: Get a session
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sessions/{id}/messages:
    post:
      summary: Send a message to a session
      operationId: sendSessionMessage
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
              required: [text]
      responses:
        "202":
          description: Accepted

  /api/v1/sessions/{id}/interrupt:
    post:
      summary: Interrupt a session's current turn
      operationId: interruptSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted

  /api/v1/sessions/{id}/close:
    post:
      summary: Close a session
      operationId: closeSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Closed

  /api/v1/sessions/{id}/model:
    post:
      summary: Switch a session's model and reasoning effort
      description: >
        The CLI takes both as start-up flags only, so this ends the current
        process and resumes the same session id with the new flags; the CLI
        keeps the transcript. Refused while the session is waiting on an
        approval.
      operationId: switchSessionModel
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: An alias (fable, opus, sonnet, haiku) or a full model name. Empty means the CLI's default.
                effort:
                  type: string
                  enum: ["", low, medium, high, xhigh, max]
      responses:
        "202":
          description: Accepted; the session is resuming under the new flags
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session is waiting on an approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: effort is not a valid level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/events:
    get:
      summary: List a session's transcript events
      operationId: listSessionEvents
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Events after the given sequence number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /api/v1/sessions/{id}/diff:
    get:
      summary: The session worktree's diff against the commit it started from
      description: >
        Covers committed and uncommitted changes alike. Only for a session
        that runs in a git worktree (its workspace has worktrees turned on);
        any other session answers 422.
      operationId: getSessionDiff
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The diff summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDiff"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/diff/file:
    get:
      summary: One file's unified diff
      operationId: getSessionFileDiff
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: The file's path, relative to the worktree root.
      responses:
        "200":
          description: The file's hunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiff"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: path is missing, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/comments:
    get:
      summary: List the review comments on a session's diff
      operationId: listReviewComments
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every comment, oldest first, sent ones included
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewComment"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: Add one inline comment to a session's diff
      description: >
        The comment is queued, not sent; POST /sessions/{id}/review sends
        every unsent comment as one message.
      operationId: createReviewComment
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                line:
                  type: integer
                side:
                  type: string
                  enum: [old, new]
                  description: Defaults to "new".
                body:
                  type: string
              required: [path, line, body]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: path or body is empty, side is not old/new, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/comments/{cid}:
    delete:
      summary: Delete one review comment
      operationId: deleteReviewComment
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/review:
    post:
      summary: Send every unsent review comment to the session
      description: >
        The comments are composed into one user message
        ("Review comments on your changes ...", one "- path:line (side):
        body" bullet each), sent like an ordinary turn, and marked sent.
      operationId: sendSessionReview
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted; the review was sent
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session is waiting on an approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: There are no unsent comments, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/commit:
    post:
      summary: Fold the session's work into one commit
      description: >
        Any checkpoint commits since the base are squashed and the working
        tree is committed on top, authored by the calling user.
      operationId: commitSession
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required: [message]
      responses:
        "200":
          description: The new commit
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha:
                    type: string
                required: [sha]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is nothing to commit, or the session is still working
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: message is empty, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/pr:
    post:
      summary: Push the session's branch and open a pull request
      description: >
        Pushes with `git push -u origin <branch>` (never forced) and opens
        the PR with the gh CLI. base defaults to the workspace's base
        branch, and failing that the checkout's current branch.
      operationId: createSessionPR
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
                base:
                  type: string
              required: [title]
      responses:
        "200":
          description: The pull request
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required: [url]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            code "gh_unavailable" (gh is not installed or not
            authenticated) or "no_remote" (the checkout has no remote)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: title is empty, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/checkpoints:
    get:
      summary: List the session's checkpoints
      operationId: listSessionCheckpoints
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkpoints, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkpoint"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/rewind:
    post:
      summary: Reset the session's worktree to a checkpoint
      operationId: rewindSession
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkpoint_id:
                  type: string
              required: [checkpoint_id]
      responses:
        "202":
          description: Accepted; the worktree was reset
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The session is running or waiting on an approval, or the
            checkpoint is no longer on this branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: checkpoint_id is missing, or the session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/discard:
    post:
      summary: Discard the session's worktree and branch
      description: >
        Closes the session's process, removes the worktree directory and
        its branch, clears the session's worktree fields and closes the
        session. The work is gone.
      operationId: discardSession
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Discarded
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session is running or waiting on an approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}/patch:
    get:
      summary: Download the session's whole diff as a patch
      operationId: getSessionPatch
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The patch
          content:
            text/x-diff:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The session has no worktree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/approvals:
    get:
      summary: List pending approvals visible to the current user
      operationId: listApprovals
      tags: [approvals]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending]
      responses:
        "200":
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  /api/v1/approvals/{id}:
    post:
      summary: Decide a pending approval
      operationId: decideApproval
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [allow, deny]
                updated_input:
                  type: object
                message:
                  type: string
              required: [decision]
      responses:
        "204":
          description: Decided

  /api/v1/approvals/{id}/snooze:
    post:
      summary: Snooze a pending approval
      operationId: snoozeApproval
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
              required: [until]
      responses:
        "204":
          description: Snoozed

  /api/v1/events:
    get:
      summary: Live event stream (Server-Sent Events)
      description: >
        Frames are "event: <Kind>\ndata: <Event JSON>\n\n", filtered to
        messages visible to the current user (owned by them, owner-less, or
        every message for an admin). A ": ping" comment is sent every 25s
        as a heartbeat.
      operationId: streamEvents
      tags: [events]
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"

  /api/v1/status:
    get:
      summary: Server status summary
      operationId: getStatus
      tags: [status]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"

  /api/v1/templates:
    get:
      summary: List templates
      description: Every template visible to the current user (owned, shared, or — for an admin — all).
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Every visible template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      summary: Create a template
      description: >
        shared marks the template as owned by nobody rather than the
        caller; only an admin may set it.
      operationId: createTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/templates/{id}:
    get:
      summary: Get a template
      operationId: getTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a template
      operationId: patchTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a template
      operationId: deleteTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/templates/{id}/render:
    post:
      summary: Dry-run render a template
      description: >
        Renders a title and prompt against payload without starting a
        session. kind selects how payload is normalized into template
        variables ("generic", "grafana" or "github"); it defaults to
        "grafana" when omitted. When title_template and/or prompt_template
        are given, they override the stored template's own text for this
        render only (e.g. a live preview while editing); the field left
        unset falls back to the stored template's text.
      operationId: renderTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                kind:
                  type: string
                  enum: [generic, grafana, github]
                title_template:
                  type: string
                prompt_template:
                  type: string
              required: [payload]
      responses:
        "200":
          description: The rendered title, prompt and any template-execution errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  prompt:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required: [title, prompt, errors]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/templates/{id}/run:
    post:
      summary: Run a template by hand
      description: >
        Starts a run of the template as the UI's "run this template now"
        does: origin ui. A template whose loop_until is set loops from
        here exactly as it would from a webhook or a schedule. vars is
        optional; an empty or missing body means no vars.
      operationId: runTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vars:
                  type: object
      responses:
        "202":
          description: Accepted; the run has been started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunID"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/triggers:
    get:
      summary: List triggers
      description: Every trigger visible to the current user (owned, shared, or — for an admin — all).
      operationId: listTriggers
      tags: [triggers]
      responses:
        "200":
          description: Every visible trigger (never includes a secret)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trigger"
    post:
      summary: Create a trigger
      description: >
        Styr generates the bearer secret; it is returned in this response
        only — GET/PATCH/list never include it again, only secret_hint.
        shared marks the trigger as owned by nobody; only an admin may set
        it.
      operationId: createTrigger
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger:
                    $ref: "#/components/schemas/Trigger"
                  secret:
                    type: string
                required: [trigger, secret]
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/triggers/samples/{kind}:
    get:
      summary: Get a realistic sample payload for a trigger kind
      description: >
        Used for "send test payload" and template dry-run preview in the
        UI. This literal path is matched before /triggers/{id}, so "samples"
        is never treated as a trigger id. An unrecognized kind is a 404.
      operationId: getTriggerSample
      tags: [triggers]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [generic, grafana, github]
      responses:
        "200":
          description: A sample webhook body for kind
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Unrecognized kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/triggers/{id}:
    get:
      summary: Get a trigger
      operationId: getTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The trigger (never includes a secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trigger"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a trigger
      operationId: patchTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "200":
          description: The updated trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trigger"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a trigger
      operationId: deleteTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/rotate-secret:
    post:
      summary: Rotate a trigger's secret
      description: Invalidates the previous secret; the new plaintext secret is returned only in this response.
      operationId: rotateTriggerSecret
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                required: [secret]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/deliveries:
    get:
      summary: List a trigger's deliveries
      operationId: listTriggerDeliveries
      tags: [triggers, deliveries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Deliveries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/test:
    post:
      summary: Run the delivery pipeline against a test payload
      description: >
        Runs the same pipeline as an inbound POST /hooks/{slug} call, as an
        authenticated request: dedupe, cooldown and the storm cap apply
        unless force is true. Responds with the same {delivery_id, status,
        run_id?} shape as POST /hooks/{slug}.
      operationId: testTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                force:
                  type: boolean
              required: [payload]
      responses:
        "200":
          description: The resulting delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/{id}/replay:
    post:
      summary: Replay a delivery
      description: Re-renders the delivery's stored payload and starts a new run, bypassing dedupe.
      operationId: replayDelivery
      tags: [deliveries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: [string, "null"]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs:
    get:
      summary: List runs
      description: >
        Runs are visible to every signed-in user regardless of who owns
        the session or trigger they came from.
      operationId: listRuns
      tags: [runs]
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [running, success, failed, timeout, needs_human]
        - name: trigger
          in: query
          description: Filter to runs started by this trigger id.
          schema:
            type: string
        - name: loop_id
          in: query
          description: Filter to runs that are an iteration of this loop.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching runs, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunView"

  /api/v1/runs/{id}:
    get:
      summary: Get a run
      description: >
        Includes the session, delivery, template and loop it was started
        from, each null when unavailable (or when the run belongs to no
        loop).
      operationId: getRun
      tags: [runs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipelines:
    get:
      summary: List pipelines
      description: Every pipeline visible to the current user (owned, shared, or — for an admin — all).
      operationId: listPipelines
      tags: [pipelines]
      responses:
        "200":
          description: Every visible pipeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pipeline"
    post:
      summary: Create a pipeline
      description: >
        The yaml is parsed and validated against workspace_id's templates
        (unique step ids, acyclic needs, templates exist, limits — see
        docs/superpowers/plans/2026-09-19-styr-v0.5-pipelines.md); an
        invalid definition is rejected with 422 invalid_pipeline and the
        full problem list. shared marks the pipeline as owned by nobody;
        only an admin may set it.
      operationId: createPipeline
      tags: [pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "422":
          description: The pipeline's yaml failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineValidationErrorBody"

  /api/v1/pipelines/validate:
    post:
      summary: Validate a pipeline definition without creating it
      description: >
        Always 200, even when the definition is invalid — ok is false and
        errors lists every problem in that case. graph is rendered from
        whatever steps parsed, regardless of validity, so the UI can draw a
        broken pipeline while pointing at what's wrong with it. This
        literal path is matched before /pipelines/{id}, so "validate" is
        never treated as a pipeline id.
      operationId: validatePipeline
      tags: [pipelines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml:
                  type: string
                workspace_id:
                  type: string
              required: [yaml, workspace_id]
      responses:
        "200":
          description: The validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /api/v1/pipelines/{id}:
    get:
      summary: Get a pipeline
      operationId: getPipeline
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a pipeline
      description: A full replace of the pipeline's name, workspace and yaml, re-validated the same way as create.
      operationId: patchPipeline
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
      responses:
        "200":
          description: The updated pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The pipeline's yaml failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineValidationErrorBody"
    delete:
      summary: Delete a pipeline
      operationId: deletePipeline
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipelines/{id}/start:
    post:
      summary: Start a pipeline run
      description: Starts a run by hand (origin ui), same shape as POST /templates/{id}/run.
      operationId: startPipeline
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
      responses:
        "202":
          description: Accepted; the pipeline run has been started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunID"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipeline-runs:
    get:
      summary: List pipeline runs
      operationId: listPipelineRuns
      tags: [pipelines]
      parameters:
        - name: pipeline
          in: query
          description: Filter to runs of this pipeline id.
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [running, success, failed, cancelled, timeout]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching pipeline runs, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRun"

  /api/v1/pipeline-runs/{id}:
    get:
      summary: Get a pipeline run
      description: >
        Includes the pipeline it belongs to, every step-run (each with the
        Run summary of its current attempt, null until one has started) and
        the pipeline's graph.
      operationId: getPipelineRun
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pipeline run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineRunView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pipeline-runs/{id}/cancel:
    post:
      summary: Cancel a running pipeline run
      description: >
        Cancels every running step-run and closes their sessions. Cancelling
        a pipeline run that is not running is a 409.
      operationId: cancelPipelineRun
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The pipeline run is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/pipeline-runs/{id}/retry-failed:
    post:
      summary: Retry a pipeline run's failed steps
      description: >
        Re-runs every failed step-run as a new attempt and continues the
        pipeline. Retrying a pipeline run with no failed steps is a 409.
      operationId: retryPipelineRunFailed
      tags: [pipelines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The pipeline run has no failed steps to retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/schedules:
    get:
      summary: List schedules
      description: Every schedule visible to the current user (owned, shared, or — for an admin — all).
      operationId: listSchedules
      tags: [schedules]
      responses:
        "200":
          description: Every visible schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      summary: Create a schedule
      description: >
        shared marks the schedule as owned by nobody rather than the
        caller; only an admin may set it. next_run_at is computed from
        cron at creation time.
      operationId: createSchedule
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedules/preview:
    post:
      summary: Preview a cron expression
      description: >
        Validates cron and returns its next 5 fire times plus a
        human-readable description, without creating a schedule. This
        literal path is matched before /schedules/{id}, so "preview" is
        never mistaken for a schedule id.
      operationId: previewSchedule
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cron:
                  type: string
              required: [cron]
      responses:
        "200":
          description: The next 5 fire times and a description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreview"
        "422":
          description: The cron expression failed to parse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/schedules/{id}:
    get:
      summary: Get a schedule
      operationId: getSchedule
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a schedule
      description: >
        A full replace of the schedule's mutable configuration, same rule
        as PATCH /triggers/{id}. Changing cron recomputes next_run_at from
        now; leaving it unchanged leaves next_run_at (and therefore the
        schedule's cadence) alone.
      operationId: patchSchedule
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a schedule
      description: Its firing history is deleted too (cascade).
      operationId: deleteSchedule
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedules/{id}/run:
    post:
      summary: Run a schedule now
      description: >
        Fires the schedule immediately, ignoring its cron and next_run_at
        (no overlap check, unlike a tick). A schedule that starts a pipeline
        answers with the "pr:"-prefixed reference in run_id and the bare
        pipeline run id in pipeline_run_id.
      operationId: runScheduleNow
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted; the run has been started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRunStarted"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedules/{id}/firings:
    get:
      summary: List a schedule's firing history
      operationId: listScheduleFirings
      tags: [schedules]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The schedule's firings, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleFiring"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loops:
    get:
      summary: List loops
      operationId: listLoops
      tags: [loops]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [running, done, exhausted, failed, stopped]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching loops, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loop"

  /api/v1/loops/{id}:
    get:
      summary: Get a loop
      description: Includes every iteration's run, in order, and the template they all render.
      operationId: getLoop
      tags: [loops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The loop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loops/{id}/stop:
    post:
      summary: Stop a loop
      description: Ends a running loop and closes its session, so the iteration in flight stops costing anything.
      operationId: stopLoop
      tags: [loops]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted; the loop has been stopped
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The loop is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/stats/gantt:
    get:
      summary: Fleet Gantt of session activity
      description: >
        One lane per session active in [from, to], with segments derived
        from that session's events (running, waiting or idle), capped at
        200 lanes.
      operationId: statsGantt
      tags: [stats]
      parameters:
        - name: from
          in: query
          description: RFC3339 timestamp; defaults to 6 hours before now.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339 timestamp; defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The Gantt lanes
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: "#/components/schemas/GanttLane"
                required: [lanes]
        "422":
          description: from is not strictly before to, or the window exceeds 7 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/stats/costs:
    get:
      summary: Cost dashboard
      description: >
        Totals per day, per owning user, per origin and the top templates
        by spend, over a trailing window of days.
      operationId: statsCosts
      tags: [stats]
      parameters:
        - name: days
          in: query
          description: Trailing window size; defaults to 30, capped at 365.
          schema:
            type: integer
      responses:
        "200":
          description: The cost dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Costs"

  /api/v1/notifications:
    get:
      summary: List notification channels
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Every notification channel (never includes a token)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
    post:
      summary: Create a notification channel
      description: Admin only. token, when given, is sealed at rest and never returned again.
      operationId: createNotification
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [ntfy, webhook]
                name:
                  type: string
                url:
                  type: string
                token:
                  type: string
                events:
                  type: array
                  items:
                    type: string
              required: [kind, name, url]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/notifications/{id}:
    patch:
      summary: Update a notification channel
      description: >
        Admin only. An omitted token leaves it unchanged; an explicit
        empty token clears it.
      operationId: patchNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [ntfy, webhook]
                name:
                  type: string
                url:
                  type: string
                token:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: The updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a notification channel
      description: Admin only.
      operationId: deleteNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/{id}/test:
    post:
      summary: Send a test notification
      description: >
        Admin only. Builds a synthetic "test" event and sends it through
        the channel using its decrypted token; the token never appears in
        this (or any) response.
      operationId: testNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The test notification was sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Sending the test notification failed (no detail leaked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /hooks/{slug}:
    post:
      summary: Inbound webhook delivery
      description: >
        Unauthenticated by session cookie — the credential is the
        trigger's own secret, via header X-Styr-Secret or Authorization
        Bearer, or (for a "github" kind trigger) an X-Hub-Signature-256
        HMAC over the raw body. Not part of /api/v1: no CSRF header
        required, no request timeout. Body is capped at 256 KiB.
      operationId: deliverHook
      security: []
      tags: [hooks]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Delivery logged (a run may or may not have started, depending on status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        "401":
          description: Bad secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Unknown or disabled trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Body exceeds the 256 KiB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: styr_session
    bearerToken:
      type: http
      scheme: bearer
      description: >
        A personal API token (POST /me/api-tokens), sent as `Authorization:
        Bearer styr_pat_...`. Equivalent to sessionCookie for every route,
        except that it is exempt from the X-Requested-With CSRF header
        rule (internal/api/middleware.go's csrfGuard).
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: The current user may not perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Not found (or not visible to the current user)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    ClaudeToken:
      type: object
      properties:
        present:
          type: boolean
        label:
          type: string
        verified_at:
          type: [string, "null"]
          format: date-time
      required: [present, label, verified_at]

    CodexKey:
      description: >
        The per-user (or service-wide) Codex credential summary. Unlike a
        Claude token there is no verified_at: a key is verified before it is
        stored and never re-verified, so present already implies "verified
        once". label is an ellipsis plus the key's last four characters; the
        key itself is never returned.
      type: object
      properties:
        present:
          type: boolean
        label:
          type: string
      required: [present, label]

    APIToken:
      description: >
        GET /me/api-tokens's element shape: never the raw secret or its
        hash, only enough to recognise a token in the list.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
      required: [id, name, prefix, created_at, last_used_at, expires_at]

    APITokenCreated:
      description: >
        POST /me/api-tokens's response: id/name/prefix plus the raw secret,
        shown once and never returned by any other response.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        token:
          type: string
      required: [id, name, prefix, token]

    User:
      description: >
        GET/PATCH /users/{id} (admin-only): every field the handler always
        serializes, but never a claude_token - see Me for the signed-in
        user's own record, which adds one.
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        prefs:
          type: object
      required: [id, email, display_name, avatar_url, role, prefs]

    Me:
      description: >
        GET/PATCH /me: the signed-in user's own record - every User field
        plus their claude_token summary (internal/api/me_handlers.go's
        meDTO), always present (the token itself never is).
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        prefs:
          type: object
        claude_token:
          $ref: "#/components/schemas/ClaudeToken"
        codex_key:
          $ref: "#/components/schemas/CodexKey"
      required: [id, email, display_name, avatar_url, role, prefs, claude_token, codex_key]

    Provider:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]

    Workspace:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
          description: null for a shared, admin-registered "path" workspace.
        name:
          type: string
        path:
          type: string
        source:
          type: string
          enum: [git, path, empty]
        repo_url:
          type: string
        branch:
          type: string
        managed:
          type: boolean
          description: Whether Styr created path and may delete it.
        state:
          type: string
          enum: [cloning, ready, failed]
        error:
          type: string
          description: The last clone failure's message, when state is "failed".
        default_profile_id:
          type: string
        worktrees:
          type: boolean
        base_branch:
          type: string
          description: >
            The branch new session worktrees are created from. Empty means
            "whatever the checkout's current branch is at that moment".
        auto_checkpoint:
          type: boolean
          description: >
            Whether Styr commits the session's worktree after every turn, so
            the work can be rewound turn by turn. On by default.
        access:
          type: string
          enum: [everyone, listed]
          description: >
            Only meaningful for a shared workspace (owner_id null): whether
            every signed-in user can see and use it ("everyone", the
            default) or only the users on its allowlist ("listed" - see
            GET/PUT /workspaces/{id}/access).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - owner_id
        - name
        - path
        - source
        - repo_url
        - branch
        - managed
        - state
        - error
        - default_profile_id
        - worktrees
        - base_branch
        - auto_checkpoint
        - access
        - created_at
        - updated_at

    WorkspaceAccess:
      description: GET /workspaces/{id}/access's response (admin-only).
      type: object
      properties:
        access:
          type: string
          enum: [everyone, listed]
        users:
          type: array
          description: The allowlist; empty when access is "everyone".
          items:
            type: object
            properties:
              id:
                type: string
              display_name:
                type: string
            required: [id, display_name]
      required: [access, users]

    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [default, acceptEdits, plan, dontAsk, auto]
        allowed_tools:
          type: array
          items:
            type: string
        disallowed_tools:
          type: array
          items:
            type: string
        max_turns:
          type: integer
        unattended:
          type: boolean
        approval_timeout:
          type: integer
          description: Seconds.
        builtin:
          type: boolean
        model:
          type: string
          description: >
            Default model for sessions started under this profile: an alias
            (fable, opus, sonnet, haiku) or a full model name. Empty means
            the CLI's own default.
        effort:
          type: string
          enum: ["", low, medium, high, xhigh, max]
          description: Default reasoning effort. Empty means the CLI's own default.
        harness:
          type: string
          enum: [claude, codex]
          description: >
            The agentic CLI sessions started under this profile default to.
            Always one of the two; a row written before the column existed
            reads as claude.
      required: [id, name, mode, allowed_tools, disallowed_tools, max_turns, unattended, approval_timeout, builtin, model, effort, harness]

    Session:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        title:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        harness:
          type: string
          enum: [claude, codex]
          description: >
            The agentic CLI this session runs on. Set from the request (or
            the profile's default) at creation, then confirmed by whatever
            the CLI's own init message reported.
        state:
          type: string
          enum: [open, running, waiting, closed, failed]
        origin:
          type: string
          enum: [ui, webhook, schedule, pipeline]
        origin_ref:
          type: string
        worktree:
          type: string
          description: >
            Absolute path of the git worktree the session runs in; empty for
            a session that runs directly in the workspace checkout.
        branch:
          type: string
          description: The worktree's branch (styr/<short id>-<slug>); empty without a worktree.
        base_ref:
          type: string
          description: The commit the worktree started from; empty without a worktree.
        worktree_shared:
          type: boolean
          description: >
            Whether this session's worktree started life as another
            session's (created with worktree_path in the request below),
            rather than being created fresh for it.
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        num_turns:
          type: integer
        cost_usd:
          type: number
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        now_line:
          type: string
        model:
          type: string
          description: >
            The model the session runs on: the alias it was started with
            until the CLI's init message replaces it with the full model
            name it resolved.
        effort:
          type: string
          enum: ["", low, medium, high, xhigh, max]
        slash_commands:
          type: array
          items:
            type: string
          description: >
            The commands the CLI reported on its last init message, without
            the leading slash (custom commands, plugin skills and
            built-ins). Empty until a process has started.
        diff_add:
          type: integer
          description: Lines added in the worktree since base_ref, as of the last turn.
        diff_del:
          type: integer
          description: Lines removed in the worktree since base_ref, as of the last turn.
      required:
        - id
        - owner_id
        - title
        - workspace_id
        - profile_id
        - harness
        - state
        - origin
        - origin_ref
        - worktree
        - branch
        - base_ref
        - worktree_shared
        - created_at
        - last_active_at
        - num_turns
        - cost_usd
        - tokens_in
        - tokens_out
        - now_line
        - model
        - effort
        - slash_commands
        - diff_add
        - diff_del

    ReviewFileChange:
      type: object
      properties:
        path:
          type: string
        old_path:
          type: string
          description: The previous path, for a rename.
        status:
          type: string
          enum: [A, M, D, R]
        add:
          type: integer
        del:
          type: integer
        binary:
          type: boolean
          description: True when git has no line-by-line diff for the file.
      required: [path, old_path, status, add, del, binary]

    ReviewDiff:
      type: object
      properties:
        base_ref:
          type: string
        branch:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFileChange"
        total_add:
          type: integer
        total_del:
          type: integer
        dirty:
          type: boolean
          description: Whether the worktree has uncommitted changes right now.
      required: [base_ref, branch, files, total_add, total_del, dirty]

    DiffLine:
      type: object
      properties:
        type:
          type: string
          enum: [ctx, add, del]
        old_no:
          type: integer
          description: 1-based line number on the old side; 0 for an added line.
        new_no:
          type: integer
          description: 1-based line number on the new side; 0 for a removed line.
        text:
          type: string
      required: [type, old_no, new_no, text]

    DiffHunk:
      type: object
      properties:
        old_start:
          type: integer
        old_lines:
          type: integer
        new_start:
          type: integer
        new_lines:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
      required: [old_start, old_lines, new_start, new_lines, lines]

    FileDiff:
      type: object
      properties:
        path:
          type: string
        old_path:
          type: string
        status:
          type: string
          enum: [A, M, D, R]
        binary:
          type: boolean
        truncated:
          type: boolean
          description: True when the diff exceeded 2 MiB and was cut off.
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"
      required: [path, old_path, status, binary, truncated, hunks]

    ReviewComment:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        path:
          type: string
        line:
          type: integer
        side:
          type: string
          enum: [old, new]
        body:
          type: string
        author_id:
          type: string
        author_name:
          type: string
          description: The author's display name, falling back to their email.
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
          description: When the comment was sent to the session; null while unsent.
      required: [id, session_id, path, line, side, body, author_id, author_name, created_at, sent_at]

    Checkpoint:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        commit_sha:
          type: string
        turn:
          type: integer
        summary:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, session_id, commit_sha, turn, summary, created_at]

    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
        seq:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        type:
          type: string
        payload:
          type: object
      required: [id, session_id, seq, at, type, payload]

    Approval:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        session_title:
          type: string
        now_line:
          type: string
        request_id:
          type: string
        tool:
          type: string
        input:
          type: object
        risk:
          type: string
          enum: [read, write, exec, destructive]
        state:
          type: string
          enum: [pending, allowed, denied, expired]
        created_at:
          type: string
          format: date-time
        snoozed_until:
          type: [string, "null"]
          format: date-time
        updated_input:
          type: object
        message:
          type: string
        plan:
          type: string
          description: >
            The plan markdown an ExitPlanMode request carries. Present only
            for tool "ExitPlanMode", which the UI renders as a plan card
            (approve = allow, request changes = deny with a message) rather
            than the ordinary tool-approval card.
      required: [id, session_id, session_title, now_line, request_id, tool, input, risk, state, created_at, snoozed_until]

    StatusInfo:
      type: object
      properties:
        version:
          type: string
        claude_version:
          type: string
        open_processes:
          type: integer
        slots:
          type: integer
        queue_depth:
          type: integer
        models:
          type: array
          description: The model aliases Styr offers, with their display labels.
          items:
            type: object
            properties:
              alias:
                type: string
              label:
                type: string
            required: [alias, label]
        efforts:
          type: array
          description: The reasoning effort levels, in increasing order.
          items:
            type: string
            enum: [low, medium, high, xhigh, max]
        harnesses:
          type: array
          description: >
            Every harness this build can drive, probed once at startup by
            running `<bin> --version`. available is false when the binary
            could not be run at all, which is how the UI explains a harness
            it must not offer.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [claude, codex]
              available:
                type: boolean
              version:
                type: string
              bin:
                type: string
                description: The configured binary name or path; never a credential.
            required: [kind, available, version, bin]
        hidden_commands:
          type: array
          description: >
            CLI built-ins the composer's slash menu must filter out of a
            session's slash_commands: they do not survive headless mode,
            are terminal-only, or are replaced by Styr's own controls.
          items:
            type: string
      required: [version, claude_version, open_processes, slots, queue_depth, models, efforts, hidden_commands, harnesses]

    TemplateInput:
      description: The create/update request body for POST/PATCH /templates(/{id}).
      type: object
      properties:
        name:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        title_template:
          type: string
        prompt_template:
          type: string
        system_prompt:
          type: string
        report_schema:
          type: string
          description: JSON schema text; empty means no structured report is expected.
        loop_until:
          type: string
          description: The report field that ends a loop started from this template; empty means it does not loop.
        loop_max:
          type: integer
          description: Iteration budget for a loop started from this template.
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
      required: [name, workspace_id, profile_id, prompt_template]

    Template:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        title_template:
          type: string
        prompt_template:
          type: string
        system_prompt:
          type: string
        report_schema:
          type: string
        loop_until:
          type: string
        loop_max:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - owner_id
        - name
        - workspace_id
        - profile_id
        - title_template
        - prompt_template
        - system_prompt
        - report_schema
        - loop_until
        - loop_max
        - created_at
        - updated_at

    TriggerInput:
      description: >
        The create/update request body for POST/PATCH /triggers(/{id}).
        Exactly one of template_id or pipeline_id must be set (422
        otherwise); the trigger starts a template run or a pipeline run
        accordingly.
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [generic, grafana, github]
        template_id:
          type: string
        pipeline_id:
          type: [string, "null"]
        dedupe_key_template:
          type: string
        cooldown_s:
          type: integer
        storm_cap_per_hour:
          type: integer
        run_on_resolved:
          type: boolean
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
        enabled:
          type: boolean
          description: Update only; omit to leave enabled state unchanged.
      required: [name, kind]

    Trigger:
      description: >
        Never includes the secret or its hash — see secret_hint. Exactly
        one of template_id (non-empty) and pipeline_id (non-null) is set.
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum: [generic, grafana, github]
        secret_hint:
          type: string
        template_id:
          type: string
        pipeline_id:
          type: [string, "null"]
        enabled:
          type: boolean
        dedupe_key_template:
          type: string
        cooldown_s:
          type: integer
        storm_cap_per_hour:
          type: integer
        run_on_resolved:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_delivery_at:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - owner_id
        - name
        - slug
        - kind
        - secret_hint
        - template_id
        - pipeline_id
        - enabled
        - dedupe_key_template
        - cooldown_s
        - storm_cap_per_hour
        - run_on_resolved
        - created_at
        - updated_at
        - last_delivery_at

    Delivery:
      type: object
      properties:
        id:
          type: string
        trigger_id:
          type: string
        received_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, deduped, cooldown, storm, rejected, failed, skipped]
        reason:
          type: string
        dedupe_key:
          type: string
        payload:
          type: object
        run_id:
          type: [string, "null"]
      required: [id, trigger_id, received_at, status, reason, dedupe_key, payload, run_id]

    DeliveryResult:
      description: >
        The shape POST /hooks/{slug} and POST /triggers/{id}/test both
        respond with: enough to look the delivery up (or follow it to the
        run it started) without the full Delivery record.
      type: object
      properties:
        delivery_id:
          type: string
        status:
          type: string
          enum: [accepted, deduped, cooldown, storm, rejected, failed, skipped]
        run_id:
          type: string
      required: [delivery_id, status]

    Run:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        template_id:
          type: [string, "null"]
        trigger_id:
          type: [string, "null"]
        delivery_id:
          type: [string, "null"]
        origin:
          type: string
        step_run_id:
          type: [string, "null"]
          description: Set when this run is one attempt of a pipeline step (origin "pipeline"); null for every other run.
        loop_id:
          type: string
          description: The loop this run is an iteration of; empty for an ordinary one-shot run.
        iteration:
          type: integer
          description: 1-based iteration number within its loop; 0 when the run belongs to no loop.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        outcome:
          type: string
          enum: [running, success, failed, timeout, needs_human]
        report:
          type: [object, "null"]
          description: >
            The structured report parsed from the session's result, when the
            template has a report_schema; null until the run finishes with one.
        summary:
          type: string
        cost_usd:
          type: number
      required:
        - id
        - session_id
        - template_id
        - trigger_id
        - delivery_id
        - origin
        - step_run_id
        - loop_id
        - iteration
        - started_at
        - finished_at
        - outcome
        - report
        - summary
        - cost_usd

    RunID:
      description: The {run_id} shape every "start a run" endpoint answers with.
      type: object
      properties:
        run_id:
          type: string
      required: [run_id]

    ScheduleRunStarted:
      description: >
        POST /schedules/{id}/run's 202 body. run_id is a run id for a
        schedule that starts a template, and the "pr:<pipeline run id>"
        reference (internal/schedules' PipelineRunRefPrefix, the same one a
        firing's run_id carries) for one that starts a pipeline;
        pipeline_run_id repeats that id unprefixed, and is absent otherwise.
      type: object
      properties:
        run_id:
          type: string
        pipeline_run_id:
          type: string
      required: [run_id]

    RunView:
      description: >
        A Run plus the records it was started from, each null when
        unavailable (e.g. the template was since deleted, or the run
        belongs to no loop).
      type: object
      properties:
        run:
          $ref: "#/components/schemas/Run"
        session:
          oneOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
        delivery:
          oneOf:
            - $ref: "#/components/schemas/Delivery"
            - type: "null"
        template:
          oneOf:
            - $ref: "#/components/schemas/Template"
            - type: "null"
        loop:
          oneOf:
            - $ref: "#/components/schemas/Loop"
            - type: "null"
        step:
          description: The pipeline step run this run is one attempt of; null for a run outside a pipeline.
          oneOf:
            - $ref: "#/components/schemas/StepRun"
            - type: "null"
        pipeline:
          description: The pipeline `step` belongs to; null whenever step is.
          oneOf:
            - $ref: "#/components/schemas/Pipeline"
            - type: "null"
      required: [run, session, delivery, template, loop, step, pipeline]

    NotificationChannel:
      description: Never includes the token — see token_present.
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ntfy, webhook]
        name:
          type: string
        url:
          type: string
        token_present:
          type: boolean
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, kind, name, url, token_present, events, enabled, created_at]

    ScheduleInput:
      description: >
        The create/update request body for POST/PATCH /schedules(/{id}).
        Exactly one of template_id or pipeline_id must be set (422
        otherwise); the schedule starts a template run or a pipeline run
        accordingly.
      type: object
      properties:
        name:
          type: string
        template_id:
          type: string
        pipeline_id:
          type: [string, "null"]
        cron:
          type: string
          description: A standard 5-field cron expression, or a descriptor (@hourly, @daily, @every 1h30m, ...).
        vars:
          type: object
          description: Fixed variables merged into every run this schedule starts, alongside the schedule key (name, fired_at).
        enabled:
          type: boolean
          description: Update only; omit to leave enabled state unchanged. Create treats omission as true.
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
      required: [name, cron]

    Schedule:
      description: Exactly one of template_id (non-empty) and pipeline_id (non-null) is set.
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        template_id:
          type: string
        pipeline_id:
          type: [string, "null"]
        cron:
          type: string
        enabled:
          type: boolean
        vars:
          type: object
        last_run_at:
          type: [string, "null"]
          format: date-time
        last_outcome:
          type: string
        next_run_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - owner_id
        - name
        - template_id
        - pipeline_id
        - cron
        - enabled
        - vars
        - last_run_at
        - last_outcome
        - next_run_at
        - created_at
        - updated_at

    ScheduleFiring:
      description: One row in a schedule's firing history.
      type: object
      properties:
        id:
          type: string
        schedule_id:
          type: string
        fired_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [started, skipped_overlap, failed]
        reason:
          type: string
        run_id:
          type: [string, "null"]
      required: [id, schedule_id, fired_at, status, reason, run_id]

    SchedulePreview:
      type: object
      properties:
        next:
          type: array
          items:
            type: string
            format: date-time
          minItems: 5
          maxItems: 5
        description:
          type: string
      required: [next, description]

    Loop:
      description: >
        One until-done repetition of a template: every iteration is a run,
        and all of them share the loop's session.
      type: object
      properties:
        id:
          type: string
        template_id:
          type: string
        session_id:
          type: [string, "null"]
          description: Nullable because a session can be deleted while its loop record stays as history.
        origin:
          type: string
          description: What started the loop (webhook, schedule or ui), carried onto every run the loop creates.
        origin_ref:
          type: string
        until_field:
          type: string
          description: The report field whose truthiness ends the loop.
        max_iterations:
          type: integer
        iteration:
          type: integer
          description: The number of the run currently (or last) started, counting from 1.
        state:
          type: string
          enum: [running, done, exhausted, failed, stopped]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - template_id
        - session_id
        - origin
        - origin_ref
        - until_field
        - max_iterations
        - iteration
        - state
        - created_at
        - updated_at

    LoopView:
      description: A Loop together with every iteration's run, in order, and the template they all render.
      type: object
      properties:
        loop:
          $ref: "#/components/schemas/Loop"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        template:
          oneOf:
            - $ref: "#/components/schemas/Template"
            - type: "null"
      required: [loop, runs, template]

    Segment:
      description: One span of a session's timeline in the fleet Gantt.
      type: object
      properties:
        kind:
          type: string
          enum: [running, waiting, idle]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required: [kind, start, end]

    GanttLane:
      description: One session's row in the fleet Gantt.
      type: object
      properties:
        session_id:
          type: string
        title:
          type: string
        owner:
          type: string
        state:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
      required: [session_id, title, owner, state, segments]

    DayCost:
      type: object
      properties:
        day:
          type: string
          description: ISO date (YYYY-MM-DD).
        usd:
          type: number
        sessions:
          type: integer
      required: [day, usd, sessions]

    NamedCost:
      description: One row of a cost breakdown (by owning user, by origin, or the top templates by spend).
      type: object
      properties:
        name:
          type: string
        usd:
          type: number
        count:
          type: integer
      required: [name, usd, count]

    Costs:
      description: The cost dashboard's payload for GET /stats/costs.
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayCost"
        by_user:
          type: array
          items:
            $ref: "#/components/schemas/NamedCost"
        by_origin:
          type: array
          items:
            $ref: "#/components/schemas/NamedCost"
        top_templates:
          type: array
          items:
            $ref: "#/components/schemas/NamedCost"
        total_usd:
          type: number
        window:
          type: integer
          description: The trailing window size, in days, this dashboard was computed over.
      required: [days, by_user, by_origin, top_templates, total_usd, window]

    PipelineInput:
      description: The create/update request body for POST/PATCH /pipelines(/{id}).
      type: object
      properties:
        name:
          type: string
        workspace_id:
          type: string
        yaml:
          type: string
          description: >
            The pipeline's YAML definition — see
            docs/superpowers/plans/2026-09-19-styr-v0.5-pipelines.md for the
            shape. Parsed and validated on every create/update.
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
      required: [name, workspace_id, yaml]

    Pipeline:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        workspace_id:
          type: string
        yaml:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, owner_id, name, workspace_id, yaml, created_at, updated_at]

    Problem:
      description: One pipeline validation problem, with the yaml source line when it could be determined (0 otherwise).
      type: object
      properties:
        line:
          type: integer
        message:
          type: string
      required: [line, message]

    PipelineValidationErrorBody:
      description: The 422 body for POST/PATCH /pipelines when the pipeline's yaml fails validation.
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid_pipeline]
            message:
              type: string
          required: [code, message]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
      required: [error, errors]

    GraphNode:
      type: object
      properties:
        id:
          type: string
        template:
          type: string
        worktree:
          type: string
        foreach:
          type: boolean
          description: True for a step with a `foreach` list (fanned out into N step-runs at run time).
      required: [id, template, worktree, foreach]

    GraphEdge:
      description: A needs dependency — from must succeed before to starts.
      type: object
      properties:
        from:
          type: string
        to:
          type: string
      required: [from, to]

    Graph:
      description: A rendering-friendly view of a pipeline's step DAG, for the frontend's graph preview.
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
      required: [nodes, edges]

    ValidationResult:
      description: >
        POST /pipelines/validate's payload. ok is false and errors is
        non-empty for an invalid definition, but the response is still 200
        — graph is rendered from whatever steps parsed regardless.
      type: object
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
        graph:
          $ref: "#/components/schemas/Graph"
      required: [ok, errors, graph]

    PipelineRunID:
      description: The {pipeline_run_id} shape POST /pipelines/{id}/start answers with.
      type: object
      properties:
        pipeline_run_id:
          type: string
      required: [pipeline_run_id]

    PipelineRun:
      type: object
      properties:
        id:
          type: string
        pipeline_id:
          type: string
        origin:
          type: string
        origin_ref:
          type: string
        input:
          type: object
          description: The pipeline-level vars payload, available to every step's with/foreach as .payload.
        state:
          type: string
          enum: [running, success, failed, cancelled, timeout]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        cost_usd:
          type: number
          description: The sum of every step-run's cost.
      required: [id, pipeline_id, origin, origin_ref, input, state, started_at, finished_at, cost_usd]

    StepRun:
      description: One node's execution within a PipelineRun. A foreach node gets one StepRun per fan-out item; a retried attempt gets a new StepRun (same step_id, incremented attempt).
      type: object
      properties:
        id:
          type: string
        pipeline_run_id:
          type: string
        step_id:
          type: string
          description: The step id from the pipeline's yaml, e.g. "triage".
        index_in_fanout:
          type: integer
          description: 0 for a non-foreach step; the item's position for a foreach one.
        item:
          type: string
          description: The foreach item's JSON; empty for a non-foreach step.
        run_id:
          type: [string, "null"]
          description: Null until the run.Engine session for this attempt is started.
        attempt:
          type: integer
        state:
          type: string
          enum: [pending, running, success, failed, skipped, cancelled]
        report:
          type: [object, "null"]
          description: The step's structured report; null until the step finishes with one.
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        worktree:
          type: string
          description: Absolute path of the worktree this step ran in; empty for none, or not yet started.
      required:
        - id
        - pipeline_run_id
        - step_id
        - index_in_fanout
        - item
        - run_id
        - attempt
        - state
        - report
        - started_at
        - finished_at
        - worktree

    PipelineRunStepView:
      description: One entry of PipelineRunView.steps — a StepRun plus the Run summary of its current attempt, null until the executor has started one.
      allOf:
        - $ref: "#/components/schemas/StepRun"
        - type: object
          properties:
            run:
              oneOf:
                - $ref: "#/components/schemas/Run"
                - type: "null"
          required: [run]

    PipelineRunView:
      description: A PipelineRun together with the records a UI needs to render it without further round trips.
      type: object
      properties:
        run:
          $ref: "#/components/schemas/PipelineRun"
        pipeline:
          $ref: "#/components/schemas/Pipeline"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRunStepView"
        graph:
          $ref: "#/components/schemas/Graph"
      required: [run, pipeline, steps, graph]
