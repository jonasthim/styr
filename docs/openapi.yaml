openapi: 3.1.0
info:
  title: Styr API
  description: >
    Styr's REST and SSE API: OIDC login, Claude Code sessions, approvals,
    workspaces, profiles and server administration.
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /api/v1/auth/providers:
    get:
      summary: List configured OIDC login providers
      operationId: listAuthProviders
      security: []
      tags: [auth]
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /api/v1/auth/login/{slug}:
    get:
      summary: Begin an OIDC login
      operationId: beginAuthLogin
      security: []
      tags: [auth]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint

  /api/v1/auth/callback:
    get:
      summary: Complete an OIDC login
      operationId: completeAuthLogin
      security: []
      tags: [auth]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to "/" on success, "/login?error=..." on failure

  /api/v1/auth/logout:
    post:
      summary: Log out
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out

  /api/v1/auth/logout-all:
    post:
      summary: Log out every browser session for the current user
      operationId: logoutAll
      tags: [auth]
      responses:
        "204":
          description: Logged out everywhere
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      summary: Get the current user
      description: >
        Unlike GET/PATCH /users/{id} (admin-only, no claude_token), this is
        the signed-in user's own record and always carries their
        claude_token summary.
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update the current user's preferences
      operationId: patchMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefs:
                  type: object
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /api/v1/me/claude-token:
    put:
      summary: Set the current user's Claude token
      description: >
        The token is verified before anything is stored; on a failed verify
        nothing is written and the response is 422 token_invalid. The token
        itself is never returned by any response.
      operationId: putMeClaudeToken
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "204":
          description: Token verified and stored
        "422":
          description: The token failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Remove the current user's Claude token
      operationId: deleteMeClaudeToken
      tags: [me]
      responses:
        "204":
          description: Removed (idempotent)

  /api/v1/users:
    get:
      summary: List users
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: Every user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{id}:
    patch:
      summary: Change a user's role
      operationId: patchUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, member]
              required: [role]
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/settings:
    get:
      summary: Get server-wide settings
      operationId: getSettings
      tags: [admin]
      responses:
        "200":
          description: Server-wide settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_open_sessions:
                    type: integer
                  idle_timeout:
                    type: string
                    description: A Go duration string, e.g. "15m0s".
                  service_token:
                    $ref: "#/components/schemas/ClaudeToken"
                required: [max_open_sessions, idle_timeout, service_token]
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/service-token:
    put:
      summary: Set the service-wide Claude token
      description: Same verify-then-store rule as PUT /me/claude-token.
      operationId: putServiceToken
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "204":
          description: Token verified and stored
        "422":
          description: The token failed verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces:
    get:
      summary: List workspaces
      description: >
        Every workspace visible to the current user: workspaces they own,
        shared (admin-registered) workspaces, and — for an admin — every
        workspace.
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: Every visible workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      summary: Create a workspace
      description: >
        Styr manages a workspace's directory unless source is "path". For
        source "git" the workspace is created in state "cloning" and
        cloned in the background (poll GET /workspaces/{id} or watch
        "workspace.state" on the SSE stream for the transition to "ready"
        or "failed"). For source "empty" a fresh directory is created and
        `git init -b main` is run synchronously. For source "path" — an
        existing absolute server path, shared by everyone — the caller
        must be an admin, and path must exist, be a directory, and
        contain a .git entry (directory or file); otherwise 422
        invalid_path. default_profile_id defaults to "interactive" when
        omitted.
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                source:
                  type: string
                  enum: [git, path, empty]
                repo_url:
                  type: string
                  description: Required when source is "git".
                branch:
                  type: string
                  description: Optional, source "git" only.
                path:
                  type: string
                  description: Required when source is "path".
                default_profile_id:
                  type: string
                worktrees:
                  type: boolean
              required: [name, source]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          description: source "path" was requested by a non-admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >
            invalid_url (source "git", a malformed repo_url), invalid_path
            (source "path", not an existing git directory), or name_taken
            (the name is already used by another workspace owned by this
            user, or by another shared workspace)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces/{id}:
    get:
      summary: Get a workspace
      operationId: getWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a workspace
      description: The owner or an admin may update default_profile_id and/or worktrees.
      operationId: patchWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                default_profile_id:
                  type: string
                worktrees:
                  type: boolean
      responses:
        "200":
          description: The updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a workspace
      description: >
        The owner or an admin may delete a workspace. For a managed
        workspace (source "git" or "empty") its directory is removed too;
        a shared "path" workspace's directory is left alone.
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A session on this workspace is still open, running or waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/workspaces/{id}/retry:
    post:
      summary: Retry a failed clone
      description: >
        Re-runs the clone for a source "git" workspace currently in state
        "failed", transitioning it back to "cloning".
      operationId: retryWorkspace
      tags: [workspaces]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace, now in state "cloning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The workspace is not a failed git-source workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/profiles:
    get:
      summary: List profiles
      operationId: listProfiles
      tags: [profiles]
      responses:
        "200":
          description: Every profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      summary: Create a profile
      operationId: createProfile
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum: [default, acceptEdits, plan, dontAsk, auto]
                allowed_tools:
                  type: array
                  items:
                    type: string
                disallowed_tools:
                  type: array
                  items:
                    type: string
                max_turns:
                  type: integer
                unattended:
                  type: boolean
                approval_timeout:
                  type: integer
                  description: Seconds.
              required: [name, mode]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "422":
          description: mode is not an allowed permission mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/profiles/{id}:
    patch:
      summary: Update a profile
      description: >
        Builtin profiles only allow max_turns and approval_timeout to
        change. mode may never be the CLI's skip-all-permissions mode (422
        on any profile; see internal/harness's validModes).
      operationId: patchProfile
      tags: [profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                allowed_tools:
                  type: array
                  items:
                    type: string
                disallowed_tools:
                  type: array
                  items:
                    type: string
                max_turns:
                  type: integer
                unattended:
                  type: boolean
                approval_timeout:
                  type: integer
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "422":
          description: Disallowed mode, or a non-editable field on a builtin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions:
    get:
      summary: List sessions visible to the current user
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Visible sessions, in attention order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      summary: Create a session
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
                profile_id:
                  type: string
                title:
                  type: string
                prompt:
                  type: string
              required: [workspace_id, profile_id, prompt]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: workspace_id is not visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The workspace is not yet ready (e.g. still cloning)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >
            No Claude token available for the current user (add one in
            profile settings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/sessions/{id}:
    get:
      summary: Get a session
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sessions/{id}/messages:
    post:
      summary: Send a message to a session
      operationId: sendSessionMessage
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
              required: [text]
      responses:
        "202":
          description: Accepted

  /api/v1/sessions/{id}/interrupt:
    post:
      summary: Interrupt a session's current turn
      operationId: interruptSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted

  /api/v1/sessions/{id}/close:
    post:
      summary: Close a session
      operationId: closeSession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Closed

  /api/v1/sessions/{id}/events:
    get:
      summary: List a session's transcript events
      operationId: listSessionEvents
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Events after the given sequence number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /api/v1/approvals:
    get:
      summary: List pending approvals visible to the current user
      operationId: listApprovals
      tags: [approvals]
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending]
      responses:
        "200":
          description: Pending approvals, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  /api/v1/approvals/{id}:
    post:
      summary: Decide a pending approval
      operationId: decideApproval
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [allow, deny]
                updated_input:
                  type: object
                message:
                  type: string
              required: [decision]
      responses:
        "204":
          description: Decided

  /api/v1/approvals/{id}/snooze:
    post:
      summary: Snooze a pending approval
      operationId: snoozeApproval
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
              required: [until]
      responses:
        "204":
          description: Snoozed

  /api/v1/events:
    get:
      summary: Live event stream (Server-Sent Events)
      description: >
        Frames are "event: <Kind>\ndata: <Event JSON>\n\n", filtered to
        messages visible to the current user (owned by them, owner-less, or
        every message for an admin). A ": ping" comment is sent every 25s
        as a heartbeat.
      operationId: streamEvents
      tags: [events]
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"

  /api/v1/status:
    get:
      summary: Server status summary
      operationId: getStatus
      tags: [status]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"

  /api/v1/templates:
    get:
      summary: List templates
      description: Every template visible to the current user (owned, shared, or — for an admin — all).
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Every visible template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      summary: Create a template
      description: >
        shared marks the template as owned by nobody rather than the
        caller; only an admin may set it.
      operationId: createTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/templates/{id}:
    get:
      summary: Get a template
      operationId: getTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a template
      operationId: patchTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "200":
          description: The updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a template
      operationId: deleteTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/templates/{id}/render:
    post:
      summary: Dry-run render a template
      description: >
        Renders a title and prompt against payload without starting a
        session. kind selects how payload is normalized into template
        variables ("generic", "grafana" or "github"); it defaults to
        "grafana" when omitted. When title_template and/or prompt_template
        are given, they override the stored template's own text for this
        render only (e.g. a live preview while editing); the field left
        unset falls back to the stored template's text.
      operationId: renderTemplate
      tags: [templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                kind:
                  type: string
                  enum: [generic, grafana, github]
                title_template:
                  type: string
                prompt_template:
                  type: string
              required: [payload]
      responses:
        "200":
          description: The rendered title, prompt and any template-execution errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  prompt:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required: [title, prompt, errors]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers:
    get:
      summary: List triggers
      description: Every trigger visible to the current user (owned, shared, or — for an admin — all).
      operationId: listTriggers
      tags: [triggers]
      responses:
        "200":
          description: Every visible trigger (never includes a secret)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trigger"
    post:
      summary: Create a trigger
      description: >
        Styr generates the bearer secret; it is returned in this response
        only — GET/PATCH/list never include it again, only secret_hint.
        shared marks the trigger as owned by nobody; only an admin may set
        it.
      operationId: createTrigger
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger:
                    $ref: "#/components/schemas/Trigger"
                  secret:
                    type: string
                required: [trigger, secret]
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/triggers/samples/{kind}:
    get:
      summary: Get a realistic sample payload for a trigger kind
      description: >
        Used for "send test payload" and template dry-run preview in the
        UI. This literal path is matched before /triggers/{id}, so "samples"
        is never treated as a trigger id. An unrecognized kind is a 404.
      operationId: getTriggerSample
      tags: [triggers]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [generic, grafana, github]
      responses:
        "200":
          description: A sample webhook body for kind
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Unrecognized kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/triggers/{id}:
    get:
      summary: Get a trigger
      operationId: getTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The trigger (never includes a secret)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trigger"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a trigger
      operationId: patchTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "200":
          description: The updated trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trigger"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a trigger
      operationId: deleteTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/rotate-secret:
    post:
      summary: Rotate a trigger's secret
      description: Invalidates the previous secret; the new plaintext secret is returned only in this response.
      operationId: rotateTriggerSecret
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                required: [secret]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/deliveries:
    get:
      summary: List a trigger's deliveries
      operationId: listTriggerDeliveries
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Deliveries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/triggers/{id}/test:
    post:
      summary: Run the delivery pipeline against a test payload
      description: >
        Runs the same pipeline as an inbound POST /hooks/{slug} call, as an
        authenticated request: dedupe, cooldown and the storm cap apply
        unless force is true. Responds with the same {delivery_id, status,
        run_id?} shape as POST /hooks/{slug}.
      operationId: testTrigger
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                force:
                  type: boolean
              required: [payload]
      responses:
        "200":
          description: The resulting delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/{id}/replay:
    post:
      summary: Replay a delivery
      description: Re-renders the delivery's stored payload and starts a new run, bypassing dedupe.
      operationId: replayDelivery
      tags: [triggers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: [string, "null"]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs:
    get:
      summary: List runs
      description: >
        Runs are visible to every signed-in user regardless of who owns
        the session or trigger they came from.
      operationId: listRuns
      tags: [runs]
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [running, success, failed, timeout, needs_human]
        - name: trigger
          in: query
          description: Filter to runs started by this trigger id.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Matching runs, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunView"

  /api/v1/runs/{id}:
    get:
      summary: Get a run
      description: Includes the session, delivery and template it was started from, each null when unavailable.
      operationId: getRun
      tags: [runs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications:
    get:
      summary: List notification channels
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Every notification channel (never includes a token)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
    post:
      summary: Create a notification channel
      description: Admin only. token, when given, is sealed at rest and never returned again.
      operationId: createNotification
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [ntfy, webhook]
                name:
                  type: string
                url:
                  type: string
                token:
                  type: string
                events:
                  type: array
                  items:
                    type: string
              required: [kind, name, url]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/notifications/{id}:
    patch:
      summary: Update a notification channel
      description: >
        Admin only. An omitted token leaves it unchanged; an explicit
        empty token clears it.
      operationId: patchNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [ntfy, webhook]
                name:
                  type: string
                url:
                  type: string
                token:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: The updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a notification channel
      description: Admin only.
      operationId: deleteNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/{id}/test:
    post:
      summary: Send a test notification
      description: >
        Admin only. Builds a synthetic "test" event and sends it through
        the channel using its decrypted token; the token never appears in
        this (or any) response.
      operationId: testNotification
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The test notification was sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Sending the test notification failed (no detail leaked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /hooks/{slug}:
    post:
      summary: Inbound webhook delivery
      description: >
        Unauthenticated by session cookie — the credential is the
        trigger's own secret, via header X-Styr-Secret or Authorization
        Bearer, or (for a "github" kind trigger) an X-Hub-Signature-256
        HMAC over the raw body. Not part of /api/v1: no CSRF header
        required, no request timeout. Body is capped at 256 KiB.
      operationId: deliverHook
      security: []
      tags: [hooks]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Delivery logged (a run may or may not have started, depending on status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryResult"
        "401":
          description: Bad secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Unknown or disabled trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: Body exceeds the 256 KiB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: styr_session
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: The current user may not perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Not found (or not visible to the current user)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    ClaudeToken:
      type: object
      properties:
        present:
          type: boolean
        label:
          type: string
        verified_at:
          type: [string, "null"]
          format: date-time
      required: [present, label, verified_at]

    User:
      description: >
        GET/PATCH /users/{id} (admin-only): every field the handler always
        serializes, but never a claude_token - see Me for the signed-in
        user's own record, which adds one.
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [admin, member]
        prefs:
          type: object
      required: [id, email, display_name, avatar_url, role, prefs]

    Me:
      description: >
        GET/PATCH /me: the signed-in user's own record - every User field
        plus their claude_token summary (internal/api/me_handlers.go's
        meDTO), always present (the token itself never is).
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [admin, member]
        prefs:
          type: object
        claude_token:
          $ref: "#/components/schemas/ClaudeToken"
      required: [id, email, display_name, avatar_url, role, prefs, claude_token]

    Provider:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]

    Workspace:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
          description: null for a shared, admin-registered "path" workspace.
        name:
          type: string
        path:
          type: string
        source:
          type: string
          enum: [git, path, empty]
        repo_url:
          type: string
        branch:
          type: string
        managed:
          type: boolean
          description: Whether Styr created path and may delete it.
        state:
          type: string
          enum: [cloning, ready, failed]
        error:
          type: string
          description: The last clone failure's message, when state is "failed".
        default_profile_id:
          type: string
        worktrees:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - owner_id
        - name
        - path
        - source
        - repo_url
        - branch
        - managed
        - state
        - error
        - default_profile_id
        - worktrees
        - created_at
        - updated_at

    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [default, acceptEdits, plan, dontAsk, auto]
        allowed_tools:
          type: array
          items:
            type: string
        disallowed_tools:
          type: array
          items:
            type: string
        max_turns:
          type: integer
        unattended:
          type: boolean
        approval_timeout:
          type: integer
          description: Seconds.
        builtin:
          type: boolean
      required: [id, name, mode, allowed_tools, disallowed_tools, max_turns, unattended, approval_timeout, builtin]

    Session:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        title:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        harness:
          type: string
        state:
          type: string
          enum: [open, running, waiting, closed, failed]
        origin:
          type: string
          enum: [ui, webhook, schedule, pipeline]
        origin_ref:
          type: string
        worktree:
          type: string
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        num_turns:
          type: integer
        cost_usd:
          type: number
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        now_line:
          type: string
        model:
          type: string
      required:
        - id
        - owner_id
        - title
        - workspace_id
        - profile_id
        - harness
        - state
        - origin
        - origin_ref
        - worktree
        - created_at
        - last_active_at
        - num_turns
        - cost_usd
        - tokens_in
        - tokens_out
        - now_line
        - model

    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
        seq:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        type:
          type: string
        payload:
          type: object
      required: [id, session_id, seq, at, type, payload]

    Approval:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        session_title:
          type: string
        now_line:
          type: string
        request_id:
          type: string
        tool:
          type: string
        input:
          type: object
        risk:
          type: string
          enum: [read, write, exec, destructive]
        state:
          type: string
          enum: [pending, allowed, denied, expired]
        created_at:
          type: string
          format: date-time
        snoozed_until:
          type: [string, "null"]
          format: date-time
        updated_input:
          type: object
        message:
          type: string
      required: [id, session_id, session_title, now_line, request_id, tool, input, risk, state, created_at, snoozed_until]

    StatusInfo:
      type: object
      properties:
        version:
          type: string
        claude_version:
          type: string
        open_processes:
          type: integer
        slots:
          type: integer
        queue_depth:
          type: integer
      required: [version, claude_version, open_processes, slots, queue_depth]

    TemplateInput:
      description: The create/update request body for POST/PATCH /templates(/{id}).
      type: object
      properties:
        name:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        title_template:
          type: string
        prompt_template:
          type: string
        system_prompt:
          type: string
        report_schema:
          type: string
          description: JSON schema text; empty means no structured report is expected.
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
      required: [name, workspace_id, profile_id, prompt_template]

    Template:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        workspace_id:
          type: string
        profile_id:
          type: string
        title_template:
          type: string
        prompt_template:
          type: string
        system_prompt:
          type: string
        report_schema:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - owner_id
        - name
        - workspace_id
        - profile_id
        - title_template
        - prompt_template
        - system_prompt
        - report_schema
        - created_at
        - updated_at

    TriggerInput:
      description: The create/update request body for POST/PATCH /triggers(/{id}).
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [generic, grafana, github]
        template_id:
          type: string
        dedupe_key_template:
          type: string
        cooldown_s:
          type: integer
        storm_cap_per_hour:
          type: integer
        run_on_resolved:
          type: boolean
        shared:
          type: boolean
          description: Owned by nobody rather than the caller. Admin only.
        enabled:
          type: boolean
          description: Update only; omit to leave enabled state unchanged.
      required: [name, kind, template_id]

    Trigger:
      description: Never includes the secret or its hash — see secret_hint.
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: [string, "null"]
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum: [generic, grafana, github]
        secret_hint:
          type: string
        template_id:
          type: string
        enabled:
          type: boolean
        dedupe_key_template:
          type: string
        cooldown_s:
          type: integer
        storm_cap_per_hour:
          type: integer
        run_on_resolved:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_delivery_at:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - owner_id
        - name
        - slug
        - kind
        - secret_hint
        - template_id
        - enabled
        - dedupe_key_template
        - cooldown_s
        - storm_cap_per_hour
        - run_on_resolved
        - created_at
        - updated_at
        - last_delivery_at

    Delivery:
      type: object
      properties:
        id:
          type: string
        trigger_id:
          type: string
        received_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [accepted, deduped, cooldown, storm, rejected, failed, skipped]
        reason:
          type: string
        dedupe_key:
          type: string
        payload:
          type: object
        run_id:
          type: [string, "null"]
      required: [id, trigger_id, received_at, status, reason, dedupe_key, payload, run_id]

    DeliveryResult:
      description: >
        The shape POST /hooks/{slug} and POST /triggers/{id}/test both
        respond with: enough to look the delivery up (or follow it to the
        run it started) without the full Delivery record.
      type: object
      properties:
        delivery_id:
          type: string
        status:
          type: string
          enum: [accepted, deduped, cooldown, storm, rejected, failed, skipped]
        run_id:
          type: string
      required: [delivery_id, status]

    Run:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        template_id:
          type: [string, "null"]
        trigger_id:
          type: [string, "null"]
        delivery_id:
          type: [string, "null"]
        origin:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        outcome:
          type: string
          enum: [running, success, failed, timeout, needs_human]
        report:
          type: object
          description: The structured report parsed from the session's result, when the template has a report_schema.
        summary:
          type: string
        cost_usd:
          type: number
      required:
        - id
        - session_id
        - template_id
        - trigger_id
        - delivery_id
        - origin
        - started_at
        - finished_at
        - outcome
        - report
        - summary
        - cost_usd

    RunView:
      description: A Run plus the records it was started from, each null when unavailable (e.g. the template was since deleted).
      type: object
      properties:
        run:
          $ref: "#/components/schemas/Run"
        session:
          oneOf:
            - $ref: "#/components/schemas/Session"
            - type: "null"
        delivery:
          oneOf:
            - $ref: "#/components/schemas/Delivery"
            - type: "null"
        template:
          oneOf:
            - $ref: "#/components/schemas/Template"
            - type: "null"
      required: [run, session, delivery, template]

    NotificationChannel:
      description: Never includes the token — see token_present.
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ntfy, webhook]
        name:
          type: string
        url:
          type: string
        token_present:
          type: boolean
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, kind, name, url, token_present, events, enabled, created_at]
